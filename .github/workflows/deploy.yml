name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/auth/**'
              - 'packages/core/**'
              - 'packages/db/**'
              - 'packages/domain/**'
              - 'packages/rpc/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/deploy.yml'

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-and-push-docker-image:
    needs:
      - typecheck
      - lint
      - test
      - changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/coeeter/kaiser-api:latest
            ghcr.io/coeeter/kaiser-api:${{ github.sha }}

      - name: Deploy to prod
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -uo pipefail

          if [ -z "${DOKPLOY_WEBHOOK_URL}" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL is unset. Nothing was deployed."
            exit 1
          fi

          # Retry connection-level failures and the standard transient 5xx only.
          # Gateway timeouts are deliberately excluded: the origin has already
          # accepted the request and is most likely mid-deploy, so retrying
          # would queue a second one.
          body="$(mktemp)"
          exit_code=0
          status="$(
            curl --silent --show-error --request POST \
              --connect-timeout 15 \
              --max-time 180 \
              --retry 3 \
              --retry-delay 5 \
              --retry-connrefused \
              --write-out '%{http_code}' \
              --output "${body}" \
              "${DOKPLOY_WEBHOOK_URL}"
          )" || exit_code=$?

          echo "curl exit code: ${exit_code}"
          echo "http status: ${status:-none}"
          echo "response body:"
          cat "${body}"
          echo

          if [ "${exit_code}" -ne 0 ]; then
            echo "::error::Webhook never completed (curl exit ${exit_code}). Prod was not redeployed."
            exit 1
          fi

          case "${status}" in
            2*)
              echo "Webhook accepted by Dokploy."
              ;;
            408 | 502 | 504 | 522 | 524)
              echo "::warning::Webhook returned ${status} (gateway timeout). Dokploy most likely received it and is still deploying, so this was not retried. Confirm the running image before treating it as a failed deploy."
              ;;
            *)
              echo "::error::Webhook failed with HTTP ${status}. Prod was not redeployed."
              exit 1
              ;;
          esac
